name: Sync demo (onno-demo)

# Keeps the live demo (onno-erp/onno-demo → demo.cloud.onno.su) in step with the framework's in-tree
# reference app (example/). The example is the source of truth; on every release we mirror its
# domain + UI code into onno-demo and pin onno-demo to the just-released version. Pushing onno-demo
# triggers its existing deploy (onno-cloud TenantBuildService), so the demo redeploys on the release.
#
# Why per-release (not per-commit): onno-demo builds against *published* su.onno:* artifacts, so it
# can only use a feature once that feature is released — hence the wait step below, since the tag
# triggers this workflow and Publish Packages concurrently. Tag → publish → sync → redeploy keeps the
# demo == latest release with zero hand-maintenance (onno-demo becomes a generated mirror). For a
# HEAD-tracking demo you would instead publish a -SNAPSHOT on main pushes and trigger on `push: main`.
#
# Requires the repo secret ONNO_DEMO_TOKEN: a token with contents:write on onno-erp/onno-demo
# (a fine-grained PAT scoped to that repo is ideal). Deploy keys are disabled org-wide, so this
# pushes over HTTPS with the token instead of SSH.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to sync onno-demo to (without the leading v, e.g. 1.6.1)
        required: true
        type: string

concurrency:
  group: sync-demo
  cancel-in-progress: false

jobs:
  sync:
    # Pre-release tags (v5.0.0-alpha.1, -rc.1, …) publish artifacts but leave the live demo on the
    # latest stable release; a manual dispatch still syncs any version.
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The tag starts this workflow and Publish Packages at the same moment, and this one finishes in
      # seconds — so without waiting, onno-demo was pinned to a version that wasn't downloadable yet
      # and its deploy failed resolving su.onno:* / the su.onno.ui plugin (seen on 4.1.0). Wait
      # until both places the demo build resolves from serve the release: the core on Maven Central
      # (which also lags the Central Portal upload) and the su.onno.ui plugin on the onno-cloud registry
      # (mirrored at the end of Publish Packages).
      - name: Wait for the release to be resolvable
        run: |
          V="${{ steps.v.outputs.version }}"
          CORE="https://repo1.maven.org/maven2/su/onno/onno-framework/$V/onno-framework-$V.pom"
          PLUGIN="https://cloud.onno.su/modules/su/onno/ui/su.onno.ui.gradle.plugin/$V/su.onno.ui.gradle.plugin-$V.pom"
          for i in $(seq 1 180); do
            core=$(curl -s -o /dev/null -w '%{http_code}' "$CORE")
            plugin=$(curl -s -o /dev/null -w '%{http_code}' "$PLUGIN")
            if [ "$core" = 200 ] && [ "$plugin" = 200 ]; then
              echo "onno $V is published (Central + registry)."
              exit 0
            fi
            echo "waiting for onno $V: central=$core registry-plugin=$plugin (attempt $i/180)"
            sleep 30
          done
          echo "onno $V still not resolvable after 90 minutes — not pinning onno-demo to it." >&2
          exit 1

      - name: Check out onno-framework (this release)
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Check out onno-demo
        run: git clone "https://x-access-token:${{ secrets.ONNO_DEMO_TOKEN }}@github.com/onno-erp/onno-demo.git" demo

      - name: Mirror the example's domain + UI code into onno-demo
        run: |
          # Domain + UI source (com.example): the code that drifts as features land. --delete so
          # renamed/removed classes propagate. onno-demo keeps its own build files, application.yaml
          # (cloud-tuned), and any src/main/widgets wiring — those are NOT overwritten here.
          rsync -a --delete framework/example/src/main/java/ demo/src/main/java/
          # Custom widgets (src/main/widgets/*.tsx) — compiled by the su.onno.ui plugin, which
          # onno-demo applies (see its build.gradle.kts / settings.gradle.kts). The plugin ships from
          # onno >= 1.6.1, so widgets only build once onno-demo is on such a version (this sync pins it).
          if [ -d framework/example/src/main/widgets ]; then
            mkdir -p demo/src/main/widgets
            rsync -a --delete framework/example/src/main/widgets/ demo/src/main/widgets/
          else
            rm -rf demo/src/main/widgets
          fi
          # Branding / served static assets (logos, favicon).
          if [ -d framework/example/src/main/resources/static ]; then
            mkdir -p demo/src/main/resources/static
            rsync -a --delete framework/example/src/main/resources/static/ demo/src/main/resources/static/
          fi

      - name: Pin onno-demo to the released version
        run: |
          sed -i "s/^onnoCoreVersion=.*/onnoCoreVersion=${{ steps.v.outputs.version }}/" demo/gradle.properties
          grep '^onnoCoreVersion=' demo/gradle.properties

      - name: Commit & push (if anything changed)
        working-directory: demo
        run: |
          git config user.name "onno-bot"
          git config user.email "bot@onno.su"
          # Stage everything first — added, modified, and deleted. (`commit -am` / `diff --quiet`
          # only see already-tracked files, so a sync that adds new classes or widgets would be
          # silently dropped.)
          git add -A
          if git diff --cached --quiet; then
            echo "onno-demo already in sync with ${{ steps.v.outputs.version }} — nothing to push."
            exit 0
          fi
          git commit -m "chore: sync demo to onno ${{ steps.v.outputs.version }}"
          git push origin HEAD:main
