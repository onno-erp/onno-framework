name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v, e.g. 0.1.0 or 0.1.0-rc1
        required: true
        type: string

# Full releases publish to Maven Central (Central Portal) and the onno Maven repository; pre-releases
# only to the onno Maven repository. Not GitHub Packages — so no `packages: write`.
# `contents: write` is still needed to create the GitHub release.
permissions:
  contents: write

jobs:
  publish:
    name: Publish Maven artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          echo "release_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            package-lock.json

      - name: Audit frontend dependencies
        run: npm ci && node ../.github/scripts/npm-audit.mjs
        working-directory: onno-ui

      - name: Build and audit documentation
        run: npm ci && npm audit && npm run docs:build
        working-directory: docs

      - name: Check
        run: ./gradlew clean check -PreleaseVersion="${{ steps.version.outputs.release_version }}"

      - name: Verify local publication and Javadoc
        env:
          # Release versions activate artifact signing, including Maven-local verification.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenLocal aggregateJavadoc -PreleaseVersion="${{ steps.version.outputs.release_version }}"

      - name: Publish to Maven Central
        # Full releases only: a pre-release (any version with a "-", e.g. 5.0.0-alpha.2 or 2.1.0-rc1)
        # goes to the onno Maven repository alone, below, so Central only ever carries releases.
        if: steps.version.outputs.prerelease != 'true'
        # Uploads a signed deployment to the Central Portal. SONATYPE_AUTOMATIC_RELEASE=true
        # (gradle.properties) makes it release automatically once the Portal validates it — no
        # manual "Publish" click. Set that property to false to instead leave deployments staged.
        env:
          # Central Portal user token (Account → Generate User Token), exposed as Gradle properties.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # ASCII-armored GPG private key + its passphrase, for signing the release artifacts.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral -PreleaseVersion="${{ steps.version.outputs.release_version }}" --no-configuration-cache

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: onno-framework ${{ steps.version.outputs.release_version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true

      - name: Publish to the onno Maven repository
        # Every version goes to the onno Maven repository (Reposilite at repo.onno.su, artifacts in S3):
        # for a pre-release it is the only channel, for a full release a copy that resolves instantly
        # instead of waiting for Central to sync. It is not best-effort: a failure fails the run. To
        # retry only this step, `./gradlew publishAllPublicationsToOnnoCloudRepository -PreleaseVersion=<v>`
        # (CI only). The publication is signed, so the signing key is needed here too.
        env:
          ONNO_REGISTRY_URL: ${{ vars.ONNO_REGISTRY_URL || 'https://repo.onno.su/releases' }}
          ONNO_REGISTRY_USER: ${{ secrets.ONNO_REGISTRY_USER || 'publisher' }}
          ONNO_REGISTRY_TOKEN: ${{ secrets.ONNO_REGISTRY_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAllPublicationsToOnnoCloudRepository -PreleaseVersion="${{ steps.version.outputs.release_version }}" --no-configuration-cache

      - name: Publish the su.onno.ui Gradle plugin to the onno Maven repository
        # The su.onno.ui plugin lives in a pluginManagement includeBuild, so the root step above never
        # reaches it — publish its project explicitly. Its publications aren't signed, so no key.
        env:
          ONNO_REGISTRY_URL: ${{ vars.ONNO_REGISTRY_URL || 'https://repo.onno.su/releases' }}
          ONNO_REGISTRY_USER: ${{ secrets.ONNO_REGISTRY_USER || 'publisher' }}
          ONNO_REGISTRY_TOKEN: ${{ secrets.ONNO_REGISTRY_TOKEN }}
        run: ./gradlew :onno-ui-gradle-plugin:publishAllPublicationsToOnnoCloudRepository -PreleaseVersion="${{ steps.version.outputs.release_version }}" --no-configuration-cache
