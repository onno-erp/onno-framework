name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and local publication
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check
        run: ./gradlew clean check

      - name: Verify Maven local publication
        run: ./gradlew publishToMavenLocal

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            onno-ui-starter/src/main/frontend/package-lock.json

      # Advisories are gated here, on main and on every PR, rather than in the release path. An
      # advisory can be published against a transitive dependency at any time, including after a tag
      # is cut — auditing at release time turns that into an unreleasable tag with no code change of
      # its own, while auditing here blocks a merge and gets fixed on its own schedule.
      # `high` rather than the default `low` so a note-level advisory in a build-time transitive
      # cannot stop unrelated work; the release path scopes it further still.
      - name: Audit frontend dependencies
        run: npm ci && npm audit --audit-level=high
        working-directory: onno-ui-starter/src/main/frontend

      - name: Audit documentation dependencies
        run: npm ci && npm audit --audit-level=high
        working-directory: docs

      # Generated by the check above; consumers with custom widgets run this toolchain themselves.
      - name: Audit generated widget toolchain
        run: npm audit --prefix example/build/onno-widgets --audit-level=high
