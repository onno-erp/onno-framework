name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and local publication
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check
        run: ./gradlew clean check

      - name: Verify Maven local publication
        run: ./gradlew publishToMavenLocal

      # The Docs and Publish workflows build the aggregated Javadoc; a broken {@link} fails them
      # after merge or after a release tag, so check it on every PR too.
      - name: Verify aggregated Javadoc
        run: ./gradlew aggregateJavadoc

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            package-lock.json

      # The same audits the release workflow runs, here on main and every PR. An advisory can be
      # published against a transitive dependency at any time; catching it here blocks a merge and
      # gets fixed on its own schedule, instead of first surfacing on a release tag that then has
      # to be re-cut (what happened to v2.2.0). Tolerated advisories live in npm-audit.mjs.
      - name: Audit frontend dependencies
        run: npm ci && node ../.github/scripts/npm-audit.mjs
        working-directory: onno-ui

      - name: Audit documentation dependencies
        run: npm ci && npm audit
        working-directory: docs

