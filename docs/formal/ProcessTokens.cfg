\* The Java engine as it is: migrate() resets every live token before re-entering any, and
\* migration targets stay inside the branch (or its join). Every invariant and Termination hold.
CONSTANTS
    MaxRework = 2
    ResetAllBeforeEnter = TRUE
    AllowEscapingMigration = FALSE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTY Termination
